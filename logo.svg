<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fond brun foncé -->
  <rect width="32" height="32" rx="4" fill="#2C1A0E"/>

  <!-- Rebord supérieur du bocal (lèvre plate) -->
  <path d="M8.5 11.5 Q8.5 9.5 16 9.5 Q23.5 9.5 23.5 11.5 Q23.5 13 16 13 Q8.5 13 8.5 11.5 Z"
        fill="none" stroke="#F5EDD6" stroke-width="1.5"/>

  <!-- Corps du bocal arrondi vers le bas, forme fidèle à l'image -->
  <path d="M10 12.5 
           Q8 14 7.5 18 
           Q7 22 8.5 24.5 
           Q10.5 27 16 27 
           Q21.5 27 23.5 24.5 
           Q25 22 24.5 18 
           Q24 14 22 12.5"
        fill="none" stroke="#F5EDD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ouverture sombre au centre du rebord -->
  <ellipse cx="16" cy="11.5" rx="5.5" ry="1.2" fill="#1A0D06" opacity="0.7"/>

  <!-- Reflet subtil gauche pour donner du volume -->
  <path d="M10.5 15 Q9.8 19 10.5 23" stroke="#F5EDD6" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
